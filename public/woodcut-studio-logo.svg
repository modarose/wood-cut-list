<svg width="256" height="256" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="pieceA"><rect x="20" y="20" width="63" height="120" rx="4"/></clipPath>
    <clipPath id="pieceB"><rect x="87" y="20" width="53" height="63" rx="4"/></clipPath>
    <clipPath id="pieceC"><rect x="87" y="87" width="53" height="53" rx="4"/></clipPath>
  </defs>

  <!-- background panel -->
  <rect x="0" y="0" width="160" height="160" rx="32" fill="#3B2A20"/>

  <!-- piece A: tall left board -->
  <g clip-path="url(#pieceA)">
    <rect x="20" y="20" width="63" height="120" fill="#D2A679"/>
    <g stroke="#B98A5E" stroke-width="1.4" opacity="0.6">
      <path d="M20 40 H83" />
      <path d="M20 63 H83" />
      <path d="M20 90 H83" />
      <path d="M20 115 H83" />
    </g>
  </g>

  <!-- piece B: top right board -->
  <g clip-path="url(#pieceB)">
    <rect x="87" y="20" width="53" height="63" fill="#DFB88C"/>
    <g stroke="#C29868" stroke-width="1.2" opacity="0.6">
      <path d="M87 38 H140"/>
      <path d="M87 58 H140"/>
      <path d="M87 76 H140"/>
    </g>
  </g>

  <!-- piece C: bottom right board, accent kerf-mark piece -->
  <g clip-path="url(#pieceC)">
    <rect x="87" y="87" width="53" height="53" fill="#E07A3F"/>
    <g stroke="#C4622E" stroke-width="1.2" opacity="0.55">
      <path d="M87 105 H140"/>
      <path d="M87 123 H140"/>
    </g>
  </g>

  <!-- kerf lines (cut gaps) -->
  <rect x="83" y="20" width="4" height="120" fill="#3B2A20"/>
  <rect x="87" y="83" width="53" height="4" fill="#3B2A20"/>

  <!-- panel border -->
  <rect x="0.75" y="0.75" width="158.5" height="158.5" rx="31.5" fill="none" stroke="#241A13" stroke-width="1.5"/>
</svg>
